function editCredits(){ const c=cur(); if(!canEdit(c.id))return warnEdit(); askNum('Set credits', c.credits||0, v=>{ if(v==null)return; c.credits=Math.max(0,Math.round(v)); saveChar(c); renderMain(); }); }
/* click-to-place equip (mouse + touch; drag also supported where available) */
function pickItem(id){ const c=cur(); if(!canEdit(c.id))return warnEdit(); S.pick=(S.pick&&S.pick.ctx==='char'&&S.pick.id===id)?null:{ctx:'char',id}; if(S.pick){ const i=(c.inventory||[]).find(x=>x.id===id); toast('Selected: '+(i?i.name:'item'),'Now tap an equip slot'); } renderMain(); }
function slotItems(c,key){ return (c.inventory||[]).filter(i=>i.equipped&&((i.slots&&i.slots.includes(key))||i.slot===key)); }
function placeSlot(slot){ const c=cur(); if(!canEdit(c.id))return warnEdit();
  if(!(S.pick&&S.pick.ctx==='char')){ const occ=slotItems(c,slot)[0]; if(occ){ occ.equipped=false; occ.slot=null; occ.slots=null; saveChar(c); renderMain(); } return; }
  const i=(c.inventory||[]).find(x=>x.id===S.pick.id); const sd=CHAR_SLOTS.find(x=>x.k===slot);
  if(i&&sd){ const ft=itemFootprintTypes(i); if(!ft.includes('any')&&!ft.includes(sd.t)){ toast(i.name+" doesn't fit the "+sd.l+' slot','That slot takes '+sd.t+' gear'); return; }
    const keys=itemFootprintKeys(i,slot);
    (c.inventory||[]).forEach(x=>{ if(x.id!==i.id&&x.equipped){ const xk=x.slots||(x.slot?[x.slot]:[]); if(xk.some(k=>keys.includes(k))){ x.equipped=false; x.slot=null; x.slots=null; } } });
    i.equipped=true; i.slot=keys[0]; i.slots=keys; }
  S.pick=null; saveChar(c); renderMain(); }
function pickMech(kind,id){ const c=cur(); if(!canEdit(c.id))return warnEdit(); S.pick=(S.pick&&S.pick.ctx==='mech'&&S.pick.id===id)?null:{ctx:'mech',kind,id}; if(S.pick){ const m=curMech(); const it=kind==='w'?(m.weapons||[]).find(x=>x.id===id):(m.mods||[]).find(x=>x.id===id); toast('Selected: '+(it?it.name:'part'), kind==='w'?'Tap a weapon hardpoint':'Tap an equipment slot'); } renderMain(); }
function placeMechSlot(slot){ const c=cur(); if(!canEdit(c.id))return warnEdit(); const m=curMech();
  const isW=MECH_WSLOTS.some(x=>x.k===slot); const isE=MECH_ESLOTS.some(x=>x.k===slot);
  if(!(S.pick&&S.pick.ctx==='mech')){ // no selection -> clicking clears the slot
    if(isW){ const w=(m.weapons||[]).find(x=>x.slot===slot||(x.slot==='hands'&&(slot==='handL'||slot==='handR'))); if(w){ w.slot=null; saveMech(m); renderMain(); } }
    else if(isE){ const md=(m.mods||[]).find(x=>x.slot===slot); if(md){ md.slot=null; saveMech(m); renderMain(); } }
    return; }
  if(S.pick.kind==='w'){
    if(!isW){ toast('That slot is for equipment',''); return; }
    const sd=MECH_WSLOTS.find(x=>x.k===slot);
    const w=(m.weapons||[]).find(x=>x.id===S.pick.id);
    if(w){ if(isTwoHanded(w)){ if(sd.t!=='hand'){ toast(w.name+' is two-handed','Mount it on a hand'); return; } (m.weapons||[]).forEach(x=>{ if(x.slot==='handL'||x.slot==='handR'||x.slot==='hands') x.slot=null; }); w.slot='hands'; }
           else { const mt=weaponMount(w); if(mt!=='any'&&mt!==sd.t){ toast(w.name+' mounts on a '+mt,'not the '+sd.t); return; } (m.weapons||[]).forEach(x=>{ if(x.slot===slot) x.slot=null; }); w.slot=slot; } }
  } else {
    if(!isE){ toast('That slot is for a weapon',''); return; }
    const sd=MECH_ESLOTS.find(x=>x.k===slot);
    const md=(m.mods||[]).find(x=>x.id===S.pick.id); if(md){ const et=modEquipType(md); if(et!==sd.t){ toast(md.name+' is '+et+' equipment','Install it in its matching slot'); return; } (m.mods||[]).forEach(x=>{ if(x.slot===slot) x.slot=null; }); md.slot=slot; }
  }
  S.pick=null; saveMech(m); renderMain(); }

/* ---------- center: mech builder (hardpoints + equipment) ---------- */
function centerMech(c,mech,em){
  const ed=canEdit(c.id);
  const cap=em._modCap, used=em._modUsed, over=em._over;
  const L=[{k:'handL',l:'Left Hand'},{k:'wristL',l:'Left Wrist'},{k:'backL',l:'Left Back'}];
  const R=[{k:'handR',l:'Right Hand'},{k:'wristR',l:'Right Wrist'},{k:'backR',l:'Right Back'}];
  const armed=ed&&S.pick&&S.pick.ctx==='mech';
  let doll=`<div class="panel"><div class="panel-h"><h3>${esc(mech.name)} · Weapon Hardpoints</h3><span style="flex:1"></span><span class="status">${ed?(armed?'tap a hardpoint to mount':'tap a weapon, then a slot'):'view only'}</span></div>
    <div class="panel-b"><div class="doll"><div>${L.map(x=>mechWSlot(mech,x,ed)).join('')}</div><div class="dollfig">${FIG_MECH}</div><div>${R.map(x=>mechWSlot(mech,x,ed)).join('')}</div></div>
    <div style="margin-top:2px">${mechWSlot(mech,{k:'chest',l:'Chest Mount'},ed)}</div></div></div>`;
  let equip=`<div class="panel" style="margin-top:14px"><div class="panel-h"><h3>Standard Ship Equipment</h3><span style="flex:1"></span><span class="status">swap freely — affects ship stats</span></div>
    <div class="panel-b"><div class="eqgrid">${MECH_ESLOTS.map(x=>mechESlot(mech,x,ed)).join('')}</div></div></div>`;
  let meter=`<div class="meter" style="margin-top:14px"><div class="lab"><span>Extra Modifications</span><span class="mono">${used} / ${cap}</span>${ed?`<button class="addbtn" onclick="editSlots()">set cap</button>`:''}</div>
    <div class="bar" style="margin-top:8px"><i style="width:${Math.min(100,100*used/Math.max(cap,used||1))}%;background:${over?'var(--danger)':'var(--mech)'}"></i></div>
    ${over?`<div class="warnchip">⚠ ${over} modification(s) over capacity — ${signed(-over)} to mech attacks &amp; saves</div>`:`<div class="warnchip okchip">✓ ${cap-used} extra-mod slot(s) free · weapons &amp; standard equipment don't count</div>`}
    <div style="font-size:10.5px;color:var(--ink-faint);margin-top:8px;line-height:1.45">${esc(S.settings.mechOverloadRule||mech.overloadRule||'')}${isDM()?` <button class="addbtn" style="margin-top:6px" onclick="openRules()">edit rule</button>`:''}</div></div>`;
  return doll+equip+meter;
}
function mechWSlot(mech,s,ed){
  const armed=ed&&S.pick&&S.pick.ctx==='mech'&&S.pick.kind==='w'&&mechWAccepts(S.pick.id,s);
  if(s.k==='handR'){ const th=(mech.weapons||[]).find(x=>x.slot==='hands'); if(th) return `<div class="slot filled" data-slot="handR"><div class="sl">${s.l}</div><div class="empty2" style="color:var(--accent)">↤ ${esc(th.name)} (2H)</div></div>`; }
  let w=(mech.weapons||[]).find(x=>x.slot===s.k);
  if(!w && s.k==='handL') w=(mech.weapons||[]).find(x=>x.slot==='hands');
  return `<div class="slot ${w?'filled':''} ${armed?'armed':''}" data-slot="${s.k}" ${ed?`onclick="slotClick('mech','${s.k}')"`:''} ondragover="slotOver(event)" ondragleave="slotLeave(event)" ondrop="mechSlotDrop(event,'${s.k}')">
    <div class="sl">${s.l}${w&&isTwoHanded(w)?' · 2H':''}</div>
    ${w?`<div class="si"><span>${esc(w.name)}</span>${ed?`<button class="rbtn ghost" onclick="event.stopPropagation();mechUnslot('w','${w.id}')">✕</button>`:''}</div>`:`<div class="empty2">${ed?'tap to mount':'empty'}</div>`}</div>`;
}
function mechESlot(mech,s,ed){
  const md=(mech.mods||[]).find(x=>x.slot===s.k); const armed=ed&&S.pick&&S.pick.ctx==='mech'&&S.pick.kind==='m'&&mechEAccepts(S.pick.id,s);
  return `<div class="slot ${md?'filled':''} ${armed?'armed':''}" data-slot="${s.k}" ${ed?`onclick="slotClick('mech','${s.k}')"`:''} ondragover="slotOver(event)" ondragleave="slotLeave(event)" ondrop="mechSlotDrop(event,'${s.k}')">
    <div class="sl">${s.l}</div>
    ${md?`<div class="si"><span>${esc(md.name)}</span>${ed?`<button class="rbtn ghost" onclick="event.stopPropagation();mechUnslot('m','${md.id}')">✕</button>`:''}</div>${md.effects&&md.effects.length?`<div class="empty2" style="font-style:normal;color:var(--accent)">${esc(fmtEffects(md.effects))}</div>`:''}`:`<div class="empty2">${ed?'tap to install':'empty'}</div>`}</div>`;
}
/* ---------- right: mech parts list ---------- */
function colMechList(c,mech){
  const ed=canEdit(c.id);
  let h=`<div class="panel"><div class="panel-h"><h3>Weapons</h3><span class="mono" style="margin-left:6px;color:var(--ink-faint)">${(mech.weapons||[]).length}</span><span style="flex:1"></span>${ed?`<button class="addbtn" onclick="openCatalog('mech-weapon')">＋ Add</button>`:''}</div><div class="panel-b" style="padding:8px 12px;max-height:240px;overflow:auto">`;
  h+=(mech.weapons||[]).length?(mech.weapons||[]).map(w=>`<div class="itemrow invitem ${(S.pick&&S.pick.id===w.id)?'sel':''}" ${ed?`onpointerdown="pDown(event,'mech','w','${w.id}')"`:''}><span class="ico">⚔</span><div class="info"><div class="n">${esc(w.name)}${isTwoHanded(w)?' <small style="color:var(--warn)">2H</small>':''}${w.slot?` <small style="color:var(--accent)">[${esc(w.slot)}]</small>`:''}</div><div class="d">${esc((w.damage||[]).map(d=>d.formula+' '+(d.type||'')).join(', ')||w.properties||'')}</div></div>${ed?`<button class="rbtn ghost" title="edit stat effects" onclick="event.stopPropagation();editEffects('weapon','${w.id}')">fx${(w.effects&&w.effects.length)?'·'+w.effects.length:''}</button><button class="rbtn ghost catchip" title="mount point — click to change" onclick="event.stopPropagation();setWeaponMount('${w.id}')">${esc(weaponMount(w))}</button><button class="rbtn dngr" onclick="event.stopPropagation();removeWeapon('${w.id}')">✕</button>`:''}</div>`).join(''):`<div class="empty" style="padding:8px">None. Tap ＋ Add.</div>`;
  h+=`</div></div>`;
  h+=`<div class="panel" style="margin-top:14px"><div class="panel-h"><h3>Ship Parts &amp; Mods</h3><span class="mono" style="margin-left:6px;color:var(--ink-faint)">${(mech.mods||[]).length}</span><span style="flex:1"></span>${ed?`<button class="addbtn" onclick="openCatalog('mech')">＋ Add</button>`:''}</div><div class="panel-b" style="padding:8px 12px;max-height:320px;overflow:auto">`;
  h+=(mech.mods||[]).length?(mech.mods||[]).map(m=>{ const asMod=m.slot==='mod'; const inSlot=m.slot&&!asMod;
     return `<div class="itemrow invitem ${(S.pick&&S.pick.id===m.id)?'sel':''}" ${ed?`onpointerdown="pDown(event,'mech','m','${m.id}')"`:''}><span class="ico">⬡</span><div class="info"><div class="n">${esc(m.name)}${(m.grade!=null&&typeof m.grade!=="object")?` G${m.grade}`:''}${inSlot?` <small style="color:var(--accent)">[${esc(m.slot)}]</small>`:asMod?' <small style="color:var(--mech)">[extra mod]</small>':''}</div><div class="d">${esc(m.system||m.desc||'')}</div></div>${ed?`<button class="rbtn ghost" title="edit stat effects" onclick="event.stopPropagation();editEffects('mod','${m.id}')">fx${(m.effects&&m.effects.length)?'·'+m.effects.length:''}</button><button class="rbtn ghost catchip" title="equipment type — click to change" onclick="event.stopPropagation();setModCat('${m.id}')">${esc(modEquipType(m))}</button><button class="rbtn ghost" onclick="event.stopPropagation();toggleModById('${m.id}')" title="install as extra modification (counts toward overload)">${asMod?'mod✓':'+mod'}</button><button class="rbtn dngr" onclick="event.stopPropagation();removeModById('${m.id}')">✕</button>`:''}</div>`; }).join(''):`<div class="empty" style="padding:8px">None. Tap ＋ Add.</div>`;
  h+=`</div></div>`;
  h+=`<div class="panel" style="margin-top:14px"><div class="panel-h"><h3>Augments</h3><span class="mono" style="margin-left:6px;color:var(--ink-faint)">${(mech.augments||[]).length}</span><span style="flex:1"></span>${ed?`<button class="addbtn" onclick="openCatalog('maugment')">＋ Add</button>`:''}</div><div class="panel-b" style="padding:8px 12px">`;
  h+=(mech.augments||[]).length?(mech.augments||[]).map(a=>`<div class="bonusrow"><span>✦ ${esc(a.name)}${a.abilityCard?' <small style="color:var(--warn)">◆card</small>':''}${a.effects&&a.effects.length?` <small style="color:var(--accent)">${esc(fmtEffects(a.effects))}</small>`:''}</span>${ed?`<button class="rbtn ghost" title="edit stat effects" onclick="editEffects('augment','${a.id}')">fx${(a.effects&&a.effects.length)?'·'+a.effects.length:''}</button><button class="rbtn dngr" onclick="removeAugment('${a.id}')">✕</button>`:''}</div>`).join(''):`<div class="empty" style="padding:8px">No mech augments. Add chits (ability cards) or implants here.</div>`;
  h+=`</div></div>`;
  return h;
}
function removeAugment(id){ const c=cur(); if(!canEdit(c.id))return warnEdit(); const m=curMech(); m.augments=(m.augments||[]).filter(x=>x.id!==id); saveMech(m); renderMain(); }
function dragMech(ev,kind,id){ DRAGID=id;DRAGKIND=kind; ev.dataTransfer.setData('text/plain',id); ev.target.classList.add('dragging'); }
function mechSlotDrop(ev,slot){ ev.preventDefault(); ev.currentTarget.classList.remove('drop'); if(DRAGID&&DRAGKIND){ S.pick={ctx:'mech',kind:DRAGKIND,id:DRAGID}; DRAGID=null;DRAGKIND=null; placeMechSlot(slot); } }
function mechUnslot(kind,id){ const c=cur(); if(!canEdit(c.id))return warnEdit(); const m=curMech(); if(kind==='w'){const w=(m.weapons||[]).find(x=>x.id===id);if(w)w.slot=null;}else{const md=(m.mods||[]).find(x=>x.id===id);if(md)md.slot=null;} saveMech(m); renderMain(); }
function removeWeapon(id){ const c=cur(); if(!canEdit(c.id))return warnEdit(); const m=curMech(); m.weapons=(m.weapons||[]).filter(x=>x.id!==id); saveMech(m); renderMain(); }
function toggleModById(id){ const c=cur(); if(!canEdit(c.id))return warnEdit(); const m=curMech(); const md=(m.mods||[]).find(x=>x.id===id); if(md){ md.slot = md.slot==='mod'?null:'mod'; saveMech(m); renderMain(); } }
function removeModById(id){ const c=cur(); if(!canEdit(c.id))return warnEdit(); const m=curMech(); m.mods=(m.mods||[]).filter(x=>x.id!==id); saveMech(m); renderMain(); }
function setMechHP(){ const m=curMech(); const c=cur(); if(!canEdit(c.id))return warnEdit(); const v=prompt('Set Hull (0-'+m.hp.max+'):',m.hp.value); if(v!=null){ m.hp.value=Math.max(0,Math.min(m.hp.max,parseInt(v)||0)); saveMech(m); renderMain(); } }
function setMechShield(){ const m=curMech(); const c=cur(); if(!canEdit(c.id))return warnEdit(); m.shields=m.shields||{value:0,max:0}; const v=prompt('Set Shields (0-'+m.shields.max+'):',m.shields.value); if(v!=null){ m.shields.value=Math.max(0,Math.min(m.shields.max,parseInt(v)||0)); saveMech(m); renderMain(); } }
function editSlots(){ const m=curMech(); const c=cur(); if(!canEdit(c.id))return warnEdit(); askNum('Extra-modification capacity (beyond standard slots)', m.modSlots?.capacity??4, v=>{ if(v==null)return; m.modSlots={capacity:Math.max(0,Math.round(v))}; saveMech(m); renderMain(); }); }

/* ============================ Workshop (create items) ============================ */
const FORGE={type:'weapon-melee',name:'',cost:0,size:'',damage:'',damageType:'',properties:'',desc:'',activation:'',rollAbility:'',abilityCard:false,dest:'me',toLib:true,effects:[]};
const FORGE_TYPES=[
  {v:'weapon-melee',l:'Melee Weapon',dom:'char'},{v:'weapon-ranged',l:'Ranged Weapon',dom:'char'},
  {v:'armor',l:'Armor / Shield',dom:'char'},{v:'equipment',l:'Gear / Equipment',dom:'char'},
  {v:'cybernetic',l:'Cybernetic Augment',dom:'char'},{v:'techpower',l:'Tech Power / Ability',dom:'char'},
  {v:'ship-weapon',l:'Mech Weapon',dom:'mech'},{v:'ship-modification',l:'Mech Modification',dom:'mech'},
];
function colForgeHelp(){
  return `<div class="panel"><div class="panel-h"><h3>How it works</h3></div><div class="panel-b" style="font-size:12px;color:var(--ink-mid);line-height:1.6">
    <p style="margin:0 0 10px"><b style="color:var(--ink)">Type</b> decides where it lands — personal gear &amp; augments go on the pilot; mech weapons &amp; mods go on the mech.</p>
    <p style="margin:0 0 10px"><b style="color:var(--ink)">Effects</b> auto-apply when the item is equipped/installed and feed the ability scores &amp; Secondary Bonuses (e.g. <span class="mono" style="color:var(--accent)">+2 Strength</span>).</p>
    <p style="margin:0 0 10px"><b style="color:var(--ink)">Ability card</b> makes it appear in your Hand on the dashboard with a roll button — set a damage formula (e.g. <span class="mono">2d6</span>) and/or a governing ability.</p>
    <p style="margin:0"><b style="color:var(--ink)">Shared library</b> keeps a copy everyone can add from later.</p>
  </div></div>`;
}
function viewForge(c,mech){
  if(!canEdit(c.id)) return `<div class="empty">Only the pilot (or DM) can create items here. Switch identity or sign in as DM.</div>`;
  return `<div id="forgeWrap">${forgeInner(c,mech)}</div>`;
}
function forgeInner(c,mech){
  const t=FORGE.type; const isMech=t==='ship-weapon'||t==='ship-modification';
  const showDmg=/weapon/.test(t)||t==='techpower';
  const destOpts = isMech
    ? `<option value="mech" ${FORGE.dest==='mech'?'selected':''}>${mech?esc(mech.name):'this mech'}</option>`
    : `<option value="me" ${FORGE.dest==='me'?'selected':''}>${esc(c.name)} (this pilot)</option>`;
  return `<div class="panel"><div class="panel-h"><h3>Workshop — Fabricate Item</h3><span style="flex:1"></span><span class="status">${esc(c.name)}${mech?' / '+esc(mech.name):''}</span></div>
   <div class="panel-b">
    <div class="row2">
      <label class="fld"><span>Item type</span><select onchange="fset('type',this.value);fset('cat','');refreshForge()">${FORGE_TYPES.map(x=>`<option value="${x.v}" ${t===x.v?'selected':''}>${x.l}</option>`).join('')}</select></label>
      <label class="fld"><span>Name</span><input value="${esc(FORGE.name)}" oninput="fset('name',this.value)" placeholder="e.g. Ion Lance Mk II"></label>
    </div>
    <div class="row2">
      <label class="fld"><span>Cost (cr)</span><input type="number" value="${FORGE.cost}" oninput="fset('cost',this.value)"></label>
      <label class="fld"><span>${isMech?'Grade':'Weight (lb)'}</span><input type="number" value="${esc(FORGE.size)}" oninput="fset('size',this.value)" placeholder="optional"></label>
    </div>
    ${showDmg?`<div class="row2"><label class="fld"><span>Damage formula</span><input value="${esc(FORGE.damage)}" oninput="fset('damage',this.value)" placeholder="e.g. 2d6 or 1d8+mod"></label>
      <label class="fld"><span>Damage type</span><input value="${esc(FORGE.damageType)}" oninput="fset('damageType',this.value)" placeholder="Energy, Kinetic, Ion…"></label></div>`:''}
    <label class="fld"><span>Properties / tags</span><input value="${esc(FORGE.properties)}" oninput="fset('properties',this.value)" placeholder="Finesse, Reach, Reload 8…"></label>
    ${(t!=='techpower'&&t!=='cybernetic')?`<label class="fld"><span>${t==='ship-weapon'?'Mount point (which hardpoint it fits)':t==='ship-modification'?'Equipment type (which slot it fills)':'Equip slot category (which body slot it fits)'}</span><select onchange="fset('cat',this.value)">${(t==='ship-weapon'?MECH_MOUNTS:t==='ship-modification'?MECH_ECATS:CHAR_CATS).map(x=>`<option value="${x}" ${((FORGE.cat||defaultCat(t))===x)?'selected':''}>${x}</option>`).join('')}</select></label>`:''}
    <label class="fld"><span>Description</span><textarea oninput="fset('desc',this.value)" placeholder="What it is and what it does.">${esc(FORGE.desc)}</textarea></label>

    <div class="sechead"><h3>Effects (auto-applied when equipped)</h3><div class="ln"></div><button class="addbtn" onclick="addEffect()">+ Effect</button></div>
    <div id="effList">${FORGE.effects.map((e,i)=>effectRow(e,i)).join('')||'<div class="empty" style="padding:8px 0">No stat effects. Add one to modify ability scores, AC, HP, saves, etc.</div>'}</div>

    <div class="sechead"><h3>Ability card</h3><div class="ln"></div></div>
    <label style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-mid);margin-bottom:10px"><input type="checkbox" ${FORGE.abilityCard?'checked':''} onchange="fset('abilityCard',this.checked);refreshForge()" style="width:auto"> Create an ability card in the Hand (rollable on the dashboard)</label>
    ${FORGE.abilityCard?`<div class="row2">
      <label class="fld"><span>Activation</span><input value="${esc(FORGE.activation)}" oninput="fset('activation',this.value)" placeholder="Action, Bonus Action…"></label>
      <label class="fld"><span>Roll uses ability</span><select onchange="fset('rollAbility',this.value)"><option value="">— none / uses damage —</option>${ABIL.map(k=>`<option value="${k}" ${FORGE.rollAbility===k?'selected':''}>${k.toUpperCase()}</option>`).join('')}</select></label>
    </div>
    <div class="row2" style="grid-template-columns:1fr 1fr 1fr">
      <label class="fld"><span>Tech-point cost</span><input type="number" value="${esc(FORGE.tpCost||'')}" oninput="fset('tpCost',this.value)" placeholder="auto-spent"></label>
      <label class="fld"><span>Self HP on use</span><input type="number" value="${esc(FORGE.hpDelta||'')}" oninput="fset('hpDelta',this.value)" placeholder="+heal / -cost"></label>
      <label class="fld"><span>Shield on use</span><input type="number" value="${esc(FORGE.shieldDelta||'')}" oninput="fset('shieldDelta',this.value)" placeholder="+/-"></label>
    </div>`:''}

    <div class="sechead"><h3>Destination</h3><div class="ln"></div></div>
    <div class="row2">
      <label class="fld"><span>Add to</span><select onchange="fset('dest',this.value)">${destOpts}<option value="none" ${FORGE.dest==='none'?'selected':''}>Library only</option></select></label>
      <label class="fld" style="display:flex;align-items:flex-end"><label style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-mid)"><input type="checkbox" ${FORGE.toLib?'checked':''} onchange="fset('toLib',this.checked)" style="width:auto"> Save to shared party library</label></label>
    </div>
    <button class="btn" style="width:100%;margin-top:8px" onclick="fabricate()">Fabricate ${isMech?'Mech Part':'Item'}</button>
   </div></div>`;
}
function effectRow(e,i){
  return `<div class="effrow"><select onchange="FORGE.effects[${i}].target=this.value">${EFFECT_TARGETS.map(x=>`<option value="${x.v}" ${e.target===x.v?'selected':''}>${x.l}</option>`).join('')}</select>
    <input type="number" value="${e.value}" oninput="FORGE.effects[${i}].value=this.value" placeholder="±"><button class="rbtn dngr" onclick="removeEffect(${i})">✕</button></div>`;
}
function fset(k,v){ FORGE[k]=v; }

/* ============================ SHIP: Eugene's Dream (bastion) ============================ */
const SHIPRULES=(()=>{ try{ return JSON.parse(document.getElementById('shipRules').textContent); }catch(e){ return {rooms:[],upgrades:[]}; } })();

const SHIP_COLS=6, SHIP_ROWS=8;

const SHIP_CAT_COLOR={Command:'#37e0c8',Engineering:'#f2a13e',Habitation:'#8b7bff',Agriculture:'#5ad19a',Commerce:'#f2c14e',Industry:'#e8705a',Recreation:'#ff8fb1',Science:'#6fb7ff',Security:'#ff5d73',Medical:'#7ee0c4',Criminal:'#c9a7ff'};
const STATK=['crew','up','inc','ra','co','da','re','he','pw','mo','bu'];
const cr=n=>'◈'+Math.round(n||0).toLocaleString();
const sgn=n=>(n>0?'+':'')+(Math.round(n*10)/10).toLocaleString();
const ROOM_SCALE={ // what one grid square represents on a 3 km city-ship
  // districts x1000: city infrastructure
  'Engineering Core':1000,'Atrium':1000,'Bunk Pods':1000,'Communal Quarters':1000,'Mess Hall':1000,'Galley Kitchen':1000,'Sealed Storage':1000,
  'Bonded Warehouse':1000,'Hydroponics Garden':1000,'Mushroom Farm':1000,'Open Market':1000,'Ship Hangar':1000,'Droid Bay':1000,'Hospital':1000,
  // complexes x100: neighborhood-scale facilities
  'Engineering Workshop':100,'Fabrication Forge':100,'Armory':100,'Medbay':100,"Soldiers' Barracks":100,'Merc Barracks':100,'Mech Bay':100,
  'Religious Hall':100,'Lounge':100,'Bio-Greenhouse':100,'Datavault Library':100,'Brig':100,
  // venues x10: one large establishment
  'Ship Bridge':10,'Council Meeting Chamber':10,'Tactical Command Center':10,'Syndicate Hall':10,'Restaurant':10,'Casino':10,'Neon Holo-Theater':10,
  'Chrome Cabaret':10,'Courtesan Boudoir':10,'Laboratory':10,'Netrunner Den':10,'Chop Shop':10,"Smuggler's Hold":10,'Xeno-Kennel':10,'VR Construct':10,
  'AI Combat Simulator':10,'Cyberclinic':10,'Supercharger Station':10,'Trophy Gallery':10,'Resurrection Bay':10,'Holonet Uplink':10,
  // single establishments x1
  'Noodle Bar':1,'Boxing Gym':1,'Deathstick Den':1,'Soothsayer':1,'Deep Archive':1,'Reliquary Vault':1,'Sensory Deprivation Tank':1,'Ripperdoc Cyberware Table':1 };
const SCALE_NAME={1000:'District',100:'Complex',10:'Venue',1:'Single'};
function rscale(room){ const o=ovr(room); return o.scale!=null?o.scale:(ROOM_SCALE[room]!=null?ROOM_SCALE[room]:100); }
const COST_SCALE={1000:200,100:20,10:5,1:1};
const MONEY_SCALE={1000:10,100:3,10:2,1:1}; // credits flow much smaller than people/food at city scale
function mscale(room){ const n=rscale(room); return MONEY_SCALE[n]!=null?MONEY_SCALE[n]:1; }
const RATION_CR=0.01; // bulk food at city scale: 10 cr per 1,000 rations
function topTier(u){ return u.tier===Math.max(...SHIPRULES.upgrades.filter(x=>x.room===u.room).map(x=>x.tier)); }
function capPrice(room,v,top){ const lim=(rscale(room)>=1000||top)?10000000:999999; return Math.min(lim,Math.round(v)); }
const ROOM_DISCOUNT=0.3; // non-district rooms cost 30% of the old price (avg ~75k)
function roomPrice(room,base){ return capPrice(room,(base||0)*cscale(room)*(rscale(room)>=1000?1:ROOM_DISCOUNT),false); }
function upPrice(u){ return capPrice(u.room,(u.cost||0)*cscale(u.room),topTier(u)); }
function cscale(room){ const n=rscale(room); return COST_SCALE[n]!=null?COST_SCALE[n]:n*10; }
function scaleName(n){ return SCALE_NAME[n]||('×'+n); }
let FUEL_DEFAULT=4000;
function SC(){ return (S.ship&&+S.ship.scale)||1; }
const SQ={Pod:4,Hold:16,Deck:36}; const SCALEK=['crew','up','inc','ra','co','da','bu','pw'];
const SHIP_START_CFG={'Bunk Pods':{size:'Deck'},'Mess Hall':{size:'Deck',upgrades:["Chef's Galley"]}};
const DEFAULT_OVR={'Bunk Pods':{label:'Housing District',bu:20000},'Mess Hall':{label:'Food Hall',ra:20000},'Mushroom Farm':{label:'Mushroom Lab',ra:50000},'Open Market':{ra:20000}};
function ovr(room){ const sh=S.ship||{}; return ((sh.overrides||{})[room])||{}; }
function roomLabel(room){ return ovr(room).label||room; }
function cellSize(c){ return (c&&c.size)||((ROOMS[c&&c.room]||{}).space)||'Hold'; }
function spans(c){ return cellSize(c)==='Deck'?2:1; }
function canSpan(cells,i,ignore){ return (i%SHIP_COLS)<SHIP_COLS-1 && (cells[i+1]==null || (ignore!=null&&cells[i+1]&&cells[i+1].span===ignore)); }
function placeRoom(cells,c){ const w=spans(c); for(let i=0;i<cells.length;i++){ if(cells[i]!=null) continue; if(w===2&&!canSpan(cells,i)) continue; cells[i]=c; if(w===2) cells[i+1]={span:i}; return true; } return false; }
function defaultShip(){ const cells=Array(SHIP_COLS*SHIP_ROWS).fill(null);
  SHIP_START.forEach(n=>{ const cfg=SHIP_START_CFG[n]||{}; placeRoom(cells,{room:n,upgrades:[...(cfg.upgrades||[])],...(cfg.size?{size:cfg.size}:{})}); });
  return {v:2,debt:10000000,containers:150000,scale:1000,residents:95000,refugees:30000,name:"Eugene's Dream",day:1,bank:0,flying:true,party:5,passengers:0,holds:10,heat:0,renown:0,stock:{rations:0,components:0,data:0},cells,log:[]}; }
function ship(){ if(S.ship&&Object.isFrozen(S.ship)) S.ship=JSON.parse(JSON.stringify(S.ship)); if(!S.ship||!Array.isArray(S.ship.cells)) S.ship=defaultShip(); if(!S.ship.v||S.ship.v<2) migrateShip(S.ship); if(S.ship.v<3) migrateV3(S.ship); if(S.ship.containers==null) S.ship.containers=150000; if(S.ship.debt==null) S.ship.debt=10000000;
  if(S.ship.v<5){ S.ship.overrides=S.ship.overrides||{}; S.ship.overrides['Mushroom Farm']={...(S.ship.overrides['Mushroom Farm']||{label:'Mushroom Lab'}),ra:50000}; if((S.ship.v||0)>=4) S.ship.v=5; }
  if(S.ship.v<4){ if(S.ship.scale==null) S.ship.scale=1000; if(!S.ship.holds||S.ship.holds===10) S.ship.holds=48; S.ship.v=5; } return S.ship; }
function migrateV3(sh){ sh.overrides={...JSON.parse(JSON.stringify(DEFAULT_OVR)),...(sh.overrides||{})};
  if(sh.residents==null) sh.residents=95000; if(sh.refugees==null) sh.refugees=30000;
  sh.v=3; const core=sh.cells.find(c=>c&&c.room==='Engineering Core'); S.ship=sh;
  if(core){ for(const n of ['Fuel Cell Reactor Swap','Alternative Fuel Converter','Overclocked Couplings']){ if(shipCalc().pw>=0) break; if(!(core.upgrades||[]).includes(n)) core.upgrades=[...(core.upgrades||[]),n]; } } }
function migrateShip(sh){ // v2: room sizes. Re-flow the grid, enlarge dorms + mess hall
  const rooms=sh.cells.filter(c=>c&&c.span==null);
  rooms.forEach(c=>{ const cfg=SHIP_START_CFG[c.room]; if(cfg&&cfg.size&&!c.size){ c.size=cfg.size; (cfg.upgrades||[]).forEach(u=>{ if(!(c.upgrades||[]).includes(u)) c.upgrades=[...(c.upgrades||[]),u]; }); } });
  const cells=Array(SHIP_COLS*SHIP_ROWS).fill(null); rooms.forEach(c=>placeRoom(cells,c)); sh.cells=cells; sh.v=2; }
function shipClean(sh){ sh.history=(sh.history||[]).slice(0,7); sh.reports=(sh.reports||[]).slice(0,20); sh.log=(sh.log||[]).slice(0,40);
  sh.vault=(sh.vault||[]).map(v=>({...v,item:v.item?{name:v.item.name,category:v.item.category,rarity:v.item.rarity||null,cost:v.item.cost||0,slotType:v.item.slotType||null,mount:v.item.mount||null,equipType:v.item.equipType||null,subtype:v.item.subtype||null,properties:v.item.properties||null,weight:v.item.weight||0,description:(v.item.description||'').slice(0,300)}:null}));
  return JSON.parse(JSON.stringify(sh)); }
function saveShip(){ const sh=ship(); const clean=shipClean(sh); S.ship=clean; if(S.db){ S.db.doc('ship/eugene').set(clean).catch(e=>{ console.error('ship save failed',e); toast('Ship save failed',(e&&e.code)||'try again'); }); } else if(typeof socket!=='undefined'&&socket){ socket.emit('write',{auth:authPayload(),collection:'ship',id:'eugene',data:clean}); } }
function shipLog(msg){ const sh=ship(); sh.log=[{t:Date.now(),day:sh.day,msg},...(sh.log||[])].slice(0,40); }
function shipWho(){ return S.identity==='dm'?'DM':((S.chars[S.identity]||{}).name||'Someone'); }
function upgradesFor(room){ return SHIPRULES.upgrades.map((u,i)=>({...u,i})).filter(u=>u.room===room).sort((a,b)=>a.tier-b.tier); }
function roomStats(cell){ const r=ROOMS[cell.room]; if(!r) return null; const s={cf:r.cf}; const m=(SQ[cellSize(cell)]||16)/(SQ[r.space]||16);
  STATK.forEach(k=>s[k]=SCALEK.includes(k)?Math.round((r[k]||0)*m*((k==='up'||k==='inc')?mscale(cell.room):rscale(cell.room))):(r[k]||0));
  const o=ovr(cell.room); STATK.forEach(k=>{ if(o[k]!=null) s[k]=o[k]; });
  (cell.upgrades||[]).forEach(un=>{ const u=SHIPRULES.upgrades.find(x=>x.room===cell.room&&x.n===un); if(u) STATK.forEach(k=>s[k]+=(u[k]||0)*(SCALEK.includes(k)?((k==='up'||k==='inc')?mscale(cell.room):rscale(cell.room)):1)); }); return s; }
function heatTier(h){ return h>=75?'Kill Order':h>=50?'Most Wanted':h>=25?'Hunted':h>=10?'Watched':'Cold'; }
function renownTier(r){ const T=[[5000,'Myth'],[2000,'Legend of the Lanes'],[1000,'Name in Lights'],[750,'Syndicate Player'],[500,'Port Favorite'],[300,'Street Legend'],[150,'Trusted Crew'],[50,'Known Hauler'],[0,'Nobody']]; return T.find(t=>r>=t[0])[1]; }
function shipCalc(){ const sh=ship(); const t={inc:0,incCF:0,rooms:0,used:0}; STATK.forEach(k=>{ if(k!=='inc') t[k]=0; });
  sh.cells.forEach(c=>{ if(!c||c.span!=null) return; const s=roomStats(c); if(!s) return; t.rooms++;
    STATK.forEach(k=>{ if(k!=='inc') t[k]+=s[k]; }); if(s.cf) t.incCF+=s.inc; else t.inc+=s.inc;
    const R=ROOMS[c.room]; const z=cellSize(c); if(R&&R.type!=='Stock') t.used+=z==='Deck'?2:z==='Hold'?1:0; });
  const people=(+sh.party||0)+(+sh.passengers||0)+(+sh.residents||0)+(+sh.refugees||0), bunks=12+t.bu, over=people>bunks, heatScare=Math.max(sh.heatFP||0,sh.heatA||0)>=50, morale=t.mo-(over?2:0)-(heatScare?1:0);
  const tier=morale<=-5?['Mutinous',0.8]:morale<=-1?['Grumbling',0.9]:morale<=4?['Steady',1]:morale<=9?['Loyal',1.1]:['Family',1.2];
  const famous=(sh.renown||0)>=1000;
  const roomIncome=Math.round((t.inc+t.incCF*((sh.flying&&!famous)?0.5:1))*tier[1]);
  const freeHolds=Math.max(0,(+sh.holds||0)-t.used), freight=sh.flying?freeHolds*120:0;
  const fuel=sh.flying?(sh.fuelCost!=null?+sh.fuelCost:FUEL_DEFAULT):0, dock=(!sh.flying&&(sh.renown||0)<500)?(sh.dockCost!=null?+sh.dockCost:1500):0;
  const rationBal=t.ra-people, rationBuy=rationBal<0?Math.round(-rationBal*RATION_CR):0;
  const net=roomIncome+freight-t.up-fuel-dock-rationBuy;
  return {...t,people,bunks,over,morale,tier:tier[0],mult:tier[1],roomIncome,freight,freeHolds,fuel,dock,rationBal,rationBuy,net,heatScare,renownDay:t.re+(tier[0]==='Family'?1:0)-(tier[0]==='Mutinous'?1:0),heatDay:t.he-2}; }

function openShip(){ S.view='ship'; S.mechMode=false; S.pick=null; setMode('pilot'); renderRail(); renderMain(); }
function shipSelect(i){ S.shipSel=(S.shipSel===i?null:i); S.shipPreview=null; renderMain(); }
function shipSet(k,v){ const sh=ship(); sh[k]=v; saveShip(); renderMain(); }
function shipEditNum(k,label){ const sh=ship(); askNum(label, sh[k]||0, v=>{ if(v==null)return; sh[k]=Math.round(v); shipLog(shipWho()+' set '+label+' to '+Math.round(v)); saveShip(); renderMain(); }); }
function shipAdvance(n){ const sh=ship(); let tot=0;
  for(let d=0;d<n;d++){ const k=shipCalc(); tot+=k.net; sh.bank=(sh.bank||0)+k.net;
    sh.stock.rations=(sh.stock.rations||0)+Math.max(0,k.rationBal); sh.stock.components=(sh.stock.components||0)+k.co; sh.stock.data=(sh.stock.data||0)+k.da;
    sh.renown=(sh.renown||0)+k.renownDay; sh.heat=Math.max(0,(sh.heat||0)+k.he-2); sh.day=(sh.day||1)+1; }
  shipLog(shipWho()+' advanced '+n+' day'+(n>1?'s':'')+' → Day '+sh.day+' ('+(tot>=0?'+':'')+cr(tot)+')'); saveShip(); toast('Day '+sh.day,(tot>=0?'+':'')+cr(tot)+' to the bank'); renderMain(); }
function shipPay(cost,what){ const sh=ship(); if(cost>(sh.bank||0)){ toast('Insufficient funds in the bank','Need '+cr(cost)+' · have '+cr(sh.bank)); return false; } sh.bank-=cost; return true; }
function shipBuild(i,pay){ const sh=ship(); const nm=(document.getElementById('shipNewRoom')||{}).value||S.shipPreview; const R=ROOMS[nm]; if(!R) return;
  const old=sh.cells[i]; const size=(old&&old.size)||R.space;
  if(size==='Deck' && !(old&&spans(old)===2) && !canSpan(sh.cells,i)){ toast(nm+' is a Deck room','It needs this square and the empty one to its right'); return; }
  if(pay && !shipPay(roomPrice(nm,R.cost),nm)) return;
  if(old&&spans(old)===2&&size!=='Deck') sh.cells[i+1]=null;
  sh.cells[i]={room:nm,upgrades:[],...(old&&old.size?{size:old.size}:{})}; if(size==='Deck') sh.cells[i+1]={span:i}; S.shipPreview=null;
  shipLog(shipWho()+(old?' converted '+old.room+' into ':' built ')+nm+(pay&&roomPrice(nm,R.cost)?' ('+cr(roomPrice(nm,R.cost))+')':' (no charge)')); saveShip(); renderMain(); }
function shipRemove(i){ const sh=ship(); const c=sh.cells[i]; if(!c) return; if(spans(c)===2) sh.cells[i+1]=null; sh.cells[i]=null; shipLog(shipWho()+' cleared '+c.room); S.shipSel=null; saveShip(); renderMain(); }
function shipUpgrade(i,ui,pay){ const sh=ship(); const c=sh.cells[i]; const u=SHIPRULES.upgrades[ui]; if(!c||!u) return;
  if(pay && !shipPay(upPrice(u),u.n)) return; c.upgrades=[...(c.upgrades||[]),u.n];
  shipLog(shipWho()+' installed '+u.n+' in '+c.room+(pay&&upPrice(u)?' ('+cr(upPrice(u))+')':' (no charge)')); saveShip(); renderMain(); }
const ENLARGE={Pod:['Hold',5000],Hold:['Deck',20000]};
function shipEnlarge(i,pay){ const sh=ship(); const c=sh.cells[i]; if(!c) return; const z=cellSize(c); const e=ENLARGE[z]; if(!e) return;
  if(e[0]==='Deck' && !canSpan(sh.cells,i)){ toast('No room to enlarge','Clear the square to the right of '+c.room+' first'); return; }
  if(pay && !shipPay(roomPrice(c.room,e[1]),'enlarge')) return; c.size=e[0]; if(e[0]==='Deck') sh.cells[i+1]={span:i};
  shipLog(shipWho()+' enlarged '+c.room+' to a '+e[0]+(pay?' ('+cr(roomPrice(c.room,e[1]))+')':' (no charge)')); saveShip(); renderMain(); }
function shipOvrNum(i,k,label){ const sh=ship(); const c=sh.cells[+i]; if(!c)return; const cur=k==='scale'?rscale(c.room):roomStats(c)[k]; askNum(label+' — '+roomLabel(c.room),cur,v=>{ if(v==null)return; sh.overrides=sh.overrides||{}; sh.overrides[c.room]={...(sh.overrides[c.room]||{}),[k]:Math.round(v)}; shipLog(shipWho()+' set '+roomLabel(c.room)+' '+label+' to '+Math.round(v).toLocaleString()); saveShip(); renderMain(); }); }
function shipOvrLabel(i){ const sh=ship(); const c=sh.cells[+i]; if(!c)return;

function shipUnupgrade(i,ui){ const sh=ship(); const c=sh.cells[i]; const u=SHIPRULES.upgrades[ui]; if(!c||!u) return; c.upgrades=(c.upgrades||[]).filter(n=>n!==u.n); shipLog(shipWho()+' removed '+u.n+' from '+c.room); saveShip(); renderMain(); }
function shipDistribute(){ const sh=ship(); const chars=Object.values(S.chars); if(!chars.length) return; const share=Math.floor((sh.bank||0)/chars.length);
  if(share<=0) return toast('Nothing to distribute','The bank needs at least '+cr(chars.length)+' to split');
  if(!S.db && typeof socket!=='undefined' && socket){ socket.emit('shipDistribute',{auth:authPayload()}); toast('Distributing',cr(share)+' to each pilot'); return; }
  chars.forEach(c=>{ c.credits=(c.credits||0)+share; if(S.db) S.db.doc('characters/'+c.id).set(c).catch(()=>{}); });
  sh.bank-=share*chars.length; shipLog(shipWho()+' distributed '+cr(share)+' to each of '+chars.length+' pilots'); saveShip(); toast('Distributed',cr(share)+' to each pilot'); renderMain(); }

          <div class="fxwrap">${fxList(u)}</div>
          ${u.adv?`<div style="font-size:11.5px;color:var(--good)">+ ${esc(u.adv)}</div>`:''}${(UPG_PERKS[u.n]||[]).map(p=>`<div style="font-size:11.5px;color:var(--accent)">\u2605 Player: ${esc(p.txt)}</div>`).join('')}${u.dis?`<div style="font-size:11.5px;color:var(--danger)">− ${esc(u.dis)}</div>`:''}

          <div class="acts" style="margin-top:6px">${owned?`<span class="chip" style="color:var(--good)">installed</span><button class="rbtn dngr" onclick="shipUnupgrade(${i},${u.i})">Remove</button>`

  if(c) h+=`<button class="rbtn dngr" style="margin-top:12px" onclick="shipRemove(${i})">Clear this space</button>`;
  return h+`</div></div>`; }

const dice=(n,s)=>{ let t=0; for(let i=0;i<n;i++) t+=1+Math.floor(Math.random()*s); return t; };
function sortRooms(){ return ship().cells.filter(c=>c&&c.span==null&&c.room==='Container Sorting Room'); }
function sortRate(){ return sortRooms().reduce((t,c)=>t+5+((c.upgrades||[]).includes('Automated Sort Line')?5:0),0); }
function sortBonus(){ return sortRooms().some(c=>(c.upgrades||[]).includes('Salvage Scanner'))?10:0; }
function randomItem(rars,cats){ const pool=(S.catalog||[]).filter(i=>(!rars||rars.includes(i.rarity))&&(!cats||cats.includes(i.category))); return pool.length?pool[Math.floor(Math.random()*pool.length)]:null; }
// Large-container loot table (d100)
function rollContainer(){ const nat=1+Math.floor(Math.random()*100); const roll=Math.min(100,nat+sortBonus()); const g={rations:0,components:0,data:0,credits:0,items:[]}; let what;
  if(roll<=15){ g.components=dice(2,10); what='Scrap metal and loose fittings'; }
  else if(roll<=30){ g.rations=dice(1,6)*500; what='Sealed food stores'; }
  else if(roll<=45){ g.components=dice(3,10); what='Machine parts and wiring'; }

// Day advance with containers + daily report (overrides the earlier definition)
function shipAdvance(n){ const sh=ship(); let tot=0;
  for(let i=0;i<n;i++){ const k=shipCalc();
    const before={bank:sh.bank||0,rations:sh.stock.rations||0,components:sh.stock.components||0,data:sh.stock.data||0,renown:sh.renown||0,heat:sh.heat||0,containers:sh.containers||0};
    sh.bank=(sh.bank||0)+k.net; tot+=k.net;
    sh.stock.rations=(sh.stock.rations||0)+Math.max(0,k.rationBal); sh.stock.components=(sh.stock.components||0)+k.co; sh.stock.data=(sh.stock.data||0)+k.da;
    const short=Math.max(0,-k.rationBal), eaten=Math.min(sh.stock.rations||0,short); if(eaten){ sh.stock.rations-=eaten; sh.bank+=eaten*10; tot+=eaten*10; }
    const bought=short-eaten;
    sh.renown=(sh.renown||0)+k.renownDay; sh.heat=Math.max(0,(sh.heat||0)+k.he-2);
    const finds=[]; const rate=Math.min(sortRate(),sh.containers||0);
    for(let c=0;c<rate;c++){ const r=rollContainer(); applyLoot(sh,r.g); finds.push(lootText(r)); }
    sh.containers=(sh.containers||0)-rate; sh.day=(sh.day||1)+1;
    const delta=(a,b,lab,fmt)=>{ const v=b-a; return v?(lab+' '+(v>0?'+':'')+(fmt?fmt(v):v.toLocaleString())):null; };
    const lines=[delta(before.bank,sh.bank,'Bank',v=>cr(v)),delta(before.rations,sh.stock.rations,'Ration stock'),delta(before.components,sh.stock.components,'Components'),
      delta(before.data,sh.stock.data,'Data'),delta(before.renown,sh.renown,'Renown'),delta(before.heat,sh.heat,'Heat'),
      rate?('Containers broken down: '+rate+' ('+(sh.containers).toLocaleString()+' left)'):null,
      eaten?('Ate '+eaten.toLocaleString()+' rations from ship stores'):null, bought?('Bought '+bought.toLocaleString()+' rations from outside ('+cr(bought*10)+')'):null,
      k.pw<0?'Power brownout: '+k.pw+' — rooms offline':null, k.over?(k.people-k.bunks).toLocaleString()+' people without housing (−2 Morale)':null].filter(Boolean);
    sh.reports=[{day:sh.day,from:sh.day-1,lines,finds,net:k.net,t:Date.now()},...(sh.reports||[])].slice(0,40); }

  S.shipReportOpen=sh.reports[0]&&sh.reports[0].day; toast('Day '+sh.day+' report',(tot>=0?'+':'')+cr(tot)+' · '+(sh.reports[0].finds.length)+' containers'); renderMain(); }

  askNum(c.name+' pays into the ship bank (has '+cr(c.credits)+')',Math.min(1000,c.credits),v=>{ if(v==null) return; const amt=Math.max(0,Math.min(Math.round(v),c.credits||0)); if(!amt) return;
    const sh=ship(); c.credits-=amt; saveChar(c); sh.bank=(sh.bank||0)+amt; const line=c.name+' paid '+cr(amt)+' into the ship bank'; shipLog(line); addReportLine(sh,line); saveShip();
    toast('Contributed',cr(amt)+' from '+c.name); renderMain(); }); }

/* ============================ SHIP IV: per-resource daily ledger (overrides earlier shipAdvance/report panel) ============================ */
const RES_ROWS=[['credits','Credits',v=>cr(v)],['rations','Rations',v=>Math.round(v).toLocaleString()],['components','Components',v=>Math.round(v).toLocaleString()],['data','Data',v=>Math.round(v).toLocaleString()],
  ['renown','Renown',v=>Math.round(v).toLocaleString()],['heatFP','Heat · Frontier',v=>Math.round(v).toLocaleString()],['heatA','Heat · Althus',v=>Math.round(v).toLocaleString()],['containers','Containers',v=>Math.round(v).toLocaleString()],['debt','TCA Debt',v=>cr(v)]];
function shipSnap(sh){ return {credits:sh.bank||0,rations:sh.stock.rations||0,components:sh.stock.components||0,data:sh.stock.data||0,renown:sh.renown||0,heatFP:sh.heatFP||0,heatA:sh.heatA||0,containers:sh.containers||0,debt:sh.debt||0}; }
function shipAdvance(n){ const sh=ship(); let tot=0;
  for(let day=0;day<n;day++){ pushHist(sh); const k=shipCalc(); const start=shipSnap(sh);
    const R={}; RES_ROWS.forEach(([key])=>R[key]={start:start[key],gain:[],spend:[]});
    const add=(key,side,amt,why)=>{ if(amt) R[key][side].push({w:why,a:Math.round(amt)}); };
    // credits
    add('credits','gain',k.roomIncome,'Room income (morale ×'+k.mult+')'); add('credits','gain',k.freight,'Freight ('+k.freeHolds+' holds)');
    add('credits','spend',k.up,'Room upkeep & wages'); add('credits','spend',k.fuel,'Fuel'); add('credits','spend',k.dock,'Docking fees');
    // rations: production split by room
    let raPos=0,raNeg=0,coPos=0,coNeg=0,daPos=0,daNeg=0;
    sh.cells.forEach(c=>{ if(!c||c.span!=null) return; const s=roomStats(c); if(!s) return; if(s.ra>0)raPos+=s.ra; else raNeg-=s.ra; if(s.co>0)coPos+=s.co; else coNeg-=s.co; if(s.da>0)daPos+=s.da; else daNeg-=s.da; });
    add('rations','gain',raPos,'Grown & cooked by rooms'); add('rations','spend',raNeg,'Used by kitchens & bars'); add('rations','spend',k.people,'Eaten by '+k.people.toLocaleString()+' people');
    add('components','gain',coPos,'Produced by rooms'); add('components','spend',coNeg,'Consumed by rooms');
    add('data','gain',daPos,'Produced by rooms'); add('data','spend',daNeg,'Consumed by rooms');
    add('renown','gain',k.renownDay,'Earned by rooms'+(k.tier==='Family'?' (+1 Family morale)':''));
    const HD=heatDaily(sh,k.he), zn=(ZONES.find(z=>z[0]===sh.zone)||[0,'Neutral'])[1];
    ['heatFP','heatA'].forEach(h=>{ const cur=sh[h]||0, d=HD[h]; if(d>0) add(h,'gain',d,'Shady rooms ('+zn+' space)'); if(d<0) add(h,'spend',Math.min(cur,-d),'Heat-reducing rooms'); add(h,'spend',Math.min(2,Math.max(0,cur+d)),'Natural decay'); });
    // apply credits & resources
    let bank=(sh.bank||0)+k.roomIncome+k.freight-k.up-k.fuel-k.dock;
    let rat=(sh.stock.rations||0)+raPos-raNeg-k.people;
    if(rat<0){ const buy=-rat; add('rations','gain',buy,'Bought from outside'); const bc=Math.round(buy*RATION_CR); add('credits','spend',bc,'Bought '+buy.toLocaleString()+' rations'); bank-=bc; rat=0; }
    sh.bank=bank; sh.stock.rations=rat; sh.stock.components=(sh.stock.components||0)+coPos-coNeg; sh.stock.data=(sh.stock.data||0)+daPos-daNeg;
    sh.renown=(sh.renown||0)+k.renownDay; sh.heatFP=Math.max(0,Math.max(0,(sh.heatFP||0)+HD.heatFP)-2); sh.heatA=Math.max(0,Math.max(0,(sh.heatA||0)+HD.heatA)-2);
    // containers
    const finds=[]; const rate=Math.min(sortRate(),sh.containers||0); const found={credits:0,rations:0,components:0,data:0,items:0};
    for(let c=0;c<rate;c++){ const r=rollContainer(); applyLoot(sh,r.g); finds.push(lootText(r)); found.credits+=r.g.credits; found.rations+=r.g.rations; found.components+=r.g.components; found.data+=r.g.data; found.items+=r.g.items.length; }
    sh.containers=(sh.containers||0)-rate;
    add('credits','gain',found.credits,'Found in containers'); add('rations','gain',found.rations,'Found in containers'); add('components','gain',found.components,'Found in containers'); add('data','gain',found.data,'Found in containers');
    add('containers','spend',rate,'Broken down by sorting rooms');
    sh.day=(sh.day||1)+1; const end=shipSnap(sh); RES_ROWS.forEach(([key])=>R[key].end=end[key]);
    const net=end.credits-start.credits; tot+=net;
    const notes=[found.items?found.items+' special item'+(found.items>1?'s':'')+' sent to the Ship Vault':null, k.pw<0?'Power brownout ('+k.pw+'): some rooms offline':null,
      k.over?(k.people-k.bunks).toLocaleString()+' people without housing (−2 Morale)':null].filter(Boolean);
    sh.reports=[{day:sh.day,from:sh.day-1,res:R,lines:notes,finds,net,t:Date.now()},...(sh.reports||[])].slice(0,40); }
  shipLog(shipWho()+' advanced '+n+' day'+(n>1?'s':'')+' → Day '+sh.day+' ('+(tot>=0?'+':'')+cr(tot)+')'); saveShip();
  S.shipReportOpen=sh.day; toast('Day '+sh.day+' report',(tot>=0?'+':'')+cr(tot)); renderMain(); }
function resTable(R){ return `<table class="restab"><thead><tr><th>Resource</th><th>Start</th><th>Gained</th><th>Spent</th><th>End</th><th>Change</th></tr></thead><tbody>`+
  RES_ROWS.map(([key,lab,f])=>{ const r=R[key]; if(!r) return ''; const A=x=>Array.isArray(x)?x[1]:x.a, W=x=>Array.isArray(x)?x[0]:x.w; const g=r.gain.reduce((t,x)=>t+A(x),0), s=r.spend.reduce((t,x)=>t+A(x),0), ch=r.end-r.start;
    const tip=[...r.gain.map(x=>'+'+f(A(x))+' '+W(x)),...r.spend.map(x=>'−'+f(A(x))+' '+W(x))];
    return `<tr><td>${lab}</td><td>${f(r.start)}</td><td class="pos">${g?'+'+f(g):'—'}</td><td class="neg">${s?'−'+f(s):'—'}</td><td><b>${f(r.end)}</b></td><td class="${ch>0?'pos':ch<0?'neg':''}">${ch?(ch>0?'+':'−')+f(Math.abs(ch)):'0'}</td></tr>`+
      (tip.length?`<tr class="why"><td></td><td colspan="5">${tip.map(esc).join(' · ')}</td></tr>`:''); }).join('')+`</tbody></table>`; }
function shipReportsPanel(){ const sh=ship(); const reps=sh.reports||[];
  return `<div class="panel" style="margin-top:14px"><div class="panel-h"><h3>Daily Reports</h3><span class="status" style="margin-left:6px">${reps.length}</span><span style="flex:1"></span><span class="status">click a day to expand</span></div><div class="panel-b" style="padding:6px 14px;max-height:620px;overflow:auto">`+
    (reps.map((r,ix)=>{ const open=S.shipReportOpen===r.day||(S.shipReportOpen==null&&ix===0);
      return `<div class="report"><div class="rhead" onclick="S.shipReportOpen=${r.day};renderMain()"><b>Day ${r.from!=null?r.from+' → '+r.day:r.day}</b><span class="mono" style="color:${(r.net||0)>=0?'var(--good)':'var(--danger)'}">${r.net!=null?((r.net>=0?'+':'−')+cr(Math.abs(r.net))):''}</span></div>
        ${open?`${r.res?`<div style="overflow-x:auto">${resTable(r.res)}</div>`:''}${(r.lines||[]).length?`<ul>${r.lines.map(l=>`<li>${esc(l)}</li>`).join('')}</ul>`:''}${(r.finds||[]).length?`<div class="eyebrow" style="margin:8px 0 2px">Containers opened (${r.finds.length})</div><ul class="finds">${r.finds.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>`:''}`:''}</div>`; }).join('')||'<div class="empty" style="padding:8px">Advance the day to generate the first report.</div>')+`</div></div>`; }
/* manual resource adjustments (logged into the current day's report) */
const STORE_ROWS=[['rations','Rations','stock'],['components','Components','stock'],['data','Data','stock'],['renown','Renown','top'],['heatFP','Heat · Frontier','top'],['heatA','Heat · Althus','top'],['containers','Containers','top'],['bank','Credits (bank)','top']];
function resGet(sh,key,where){ return where==='stock'?(sh.stock[key]||0):(sh[key]||0); }
function adjustRes(key,sign){ const sh=ship(); const row=STORE_ROWS.find(r=>r[0]===key); if(!row) return; const [_,lab,where]=row;
  modal(`<div class="modal" style="width:min(380px,94vw)"><div class="modal-h"><h3>${sign>0?'Add':'Use'} ${esc(lab)}</h3><button class="x" onclick="closeModal()">×</button></div>
   <div class="modal-b"><div style="font-size:12px;color:var(--ink-mid);margin-bottom:8px">Current: <b class="mono">${resGet(sh,key,where).toLocaleString()}</b></div>
   <label class="fld"><span>Amount</span><input id="resamt" type="number" min="0" value="" placeholder="0" style="font-size:18px"></label>
   <label class="fld"><span>What for (logged in today's report)</span><input id="resnote" placeholder="${sign>0?'e.g. salvage from the mission':'e.g. repaired the mech'}"></label>
   <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" id="resok">${sign>0?'Add':'Use'}</button></div></div></div>`);
  setTimeout(()=>{const i=document.getElementById('resamt'); if(i) i.focus();},40);
  document.getElementById('resok').onclick=()=>{ const amt=Math.abs(Math.round(+document.getElementById('resamt').value||0)); const note=document.getElementById('resnote').value.trim(); closeModal(); if(!amt) return;
    const cur=resGet(sh,key,where); if(sign<0&&amt>cur&&key!=='bank') return toast('Not enough '+lab,'Have '+cur.toLocaleString());
    const nv=cur+sign*amt; if(where==='stock') sh.stock[key]=nv; else sh[key]=nv;
    const line=shipWho()+(sign>0?' added ':' used ')+amt.toLocaleString()+' '+lab.toLowerCase()+(note?' — '+note:'')+' ('+nv.toLocaleString()+' now)';
    shipLog(line); addReportLine(sh,'Manual: '+line); saveShip(); toast(sign>0?'Added':'Used',amt.toLocaleString()+' '+lab); renderMain(); }; }
function storesPanel(){ const sh=ship();
  return `<div class="panel" style="margin-bottom:14px"><div class="panel-h"><h3>Ship Stores</h3><span style="flex:1"></span><span class="status">add or use resources by hand — logged to today's report</span></div><div class="panel-b"><div class="stores">`+
    STORE_ROWS.map(([key,lab,where])=>`<div class="store"><div class="eyebrow">${lab}</div><div class="mono sv">${key==='bank'?cr(resGet(sh,key,where)):resGet(sh,key,where).toLocaleString()}</div><div class="step"><button onclick="adjustRes('${key}',-1)" title="Use">−</button><button onclick="adjustRes('${key}',1)" title="Add">+</button></div></div>`).join('')+`</div></div></div>`; }

function pushHist(sh){ const snap=JSON.parse(JSON.stringify(sh)); delete snap.history; snap.reports=(snap.reports||[]).slice(0,5); sh.history=[snap,...(sh.history||[])].slice(0,7); }

  shipLog(shipWho()+' rewound Day '+from+' \u2192 Day '+prev.day); saveShip(); toast('Back to Day '+prev.day,'Resources, containers and reports restored'); renderMain(); }

const ZONES=[['althus','Althusian'],['neutral','Neutral'],['frontier','Frontier']];
const __ship0=ship;
ship=function(){ const sh=__ship0(); if(sh.heatFP==null){ sh.heatFP=sh.heat||0; sh.heatA=sh.heat||0; } if(!sh.zone) sh.zone='neutral'; if(!sh.used) sh.used={}; return sh; };
function zoneKey(sh){ return sh.zone==='frontier'?'heatFP':sh.zone==='althus'?'heatA':null; }
// Daily heat from rooms lands on whoever controls the zone. Neutral space: no gain; heat-reducing rooms still work on both.
function heatDaily(sh,he){ const z=zoneKey(sh), d={heatFP:0,heatA:0};
  if(he>0){ if(z) d[z]=he; } else if(he<0){ if(z) d[z]=he; else { d.heatFP=he; d.heatA=he; } } return d; }
function heatShift(sh,amt){ const z=zoneKey(sh); const ks=z?[z]:['heatFP','heatA']; ks.forEach(k=>sh[k]=Math.max(0,(sh[k]||0)+amt)); return ks; }
function setZone(v){ const sh=ship(); const z=ZONES[+v]?ZONES[+v][0]:'neutral'; if(sh.zone===z) return; sh.zone=z; shipLog(shipWho()+' moved the ship into '+ZONES.find(x=>x[0]===z)[1]+' space'); saveShip(); renderMain(); }
function zoneSlider(sh){ const ix=ZONES.findIndex(z=>z[0]===sh.zone);
  return `<div class="zonebox"><div class="zonelabs">${ZONES.map((z,i)=>`<span class="${i===ix?'on':''}" onclick="setZone(${i})">${z[1]}</span>`).join('')}</div><input type="range" min="0" max="2" step="1" value="${ix<0?1:ix}" onchange="setZone(this.value)" class="zone-${sh.zone}"></div>`; }

function roomActionList(){ const out=[]; ship().cells.forEach(c=>{ if(!c||c.span!=null||!c.room) return;
  (ROOM_ACTIONS[c.room]||[]).forEach(a=>{ if(a.up&&!(c.upgrades||[]).includes(a.up)) return; if(!out.find(o=>o.room===c.room&&o.a.n===a.n)) out.push({room:c.room,a}); }); }); return out; }
function fxText(a){ const f=a.fx||{}, L=[];
  if(f.bank) L.push('+'+cr(f.bank)); if(f.components) L.push('+'+f.components+' components'); if(f.data) L.push('+'+f.data+' data'); if(f.renown) L.push('+'+f.renown+' renown');
  if(f.heat) L.push((f.heat>0?'+':'')+f.heat+' heat (zone)'); if(f.heatBoth) L.push(f.heatBoth+' heat (FP & Althus)'); if(a.vault) L.push(a.vault+' to Vault'); return L.join(' · '); }
function doRoomAction(ix){ const sh=ship(); const it=roomActionList()[ix]; if(!it) return; const {room,a}=it; const key=room+'|'+a.n;
  if(sh.used[key]===sh.day) return toast('Already used today','Once per room per day');
  if((a.co||0)>(sh.stock.components||0)) return toast('Not enough Components','Need '+a.co+', have '+(sh.stock.components||0));
  if((a.da||0)>(sh.stock.data||0)) return toast('Not enough Data','Need '+a.da+', have '+(sh.stock.data||0));
  const f=a.fx||{}; if(f.containers&&(sh.containers||0)<-f.containers) return toast('No containers left','');
  sh.stock.components=(sh.stock.components||0)-(a.co||0); sh.stock.data=(sh.stock.data||0)-(a.da||0);
  if(f.bank) sh.bank=(sh.bank||0)+f.bank; if(f.renown) sh.renown=(sh.renown||0)+f.renown; if(f.components) sh.stock.components+=f.components; if(f.data) sh.stock.data+=f.data;
  if(f.containers) sh.containers=(sh.containers||0)+f.containers; if(f.heat) heatShift(sh,f.heat); if(f.heatBoth){ sh.heatFP=Math.max(0,sh.heatFP+f.heatBoth); sh.heatA=Math.max(0,sh.heatA+f.heatBoth); }
  if(a.vault) sh.vault=[...(sh.vault||[]),{key:uid(),name:a.vault,cat:'gear',src:roomLabel(room),day:sh.day}];
  sh.used[key]=sh.day;
  const cost=[a.co?a.co+' components':null,a.da?a.da+' data':null].filter(Boolean).join(', ');
  const line=shipWho()+' used '+roomLabel(room)+': '+a.n+(cost?' (-'+cost+')':'')+(fxText(a)?' -> '+fxText(a):'')+(a.note?' - '+a.note:'');
  shipLog(line); addReportLine(sh,line); saveShip(); toast(a.n,a.note||fxText(a)); renderMain(); }

/* ============================ SHIP VI: morale panel ============================ */
const MORALE_TIERS=[
  ['Mutinous','-5 or less',0.8,'Income \u00d70.8 \u00b7 \u22121 Renown/day \u00b7 one extra ship Event per cycle (sabotage) \u00b7 no rest benefits aboard'],
  ['Grumbling','-4 to -1',0.9,'Income \u00d70.9 \u00b7 Room Actions and Work Orders take an extra day (DM call) \u00b7 short rests only'],
  ['Steady','0 to 4',1,'Normal income \u00b7 normal rests'],
  ['Loyal','5 to 9',1.1,'Income \u00d71.1 \u00b7 crew volunteer as Defenders in boarding actions (+2) \u00b7 pilots get Well Rested after a long rest aboard'],
  ['Family','10+',1.2,'Income \u00d71.2 \u00b7 +1 Renown/day \u00b7 once per cycle the crew covers one Work Order cost \u00b7 Well Rested and Well Fed after a long rest aboard']];
function moraleSources(){ const sh=ship(), k=shipCalc(), by={};
  sh.cells.forEach(c=>{ if(!c||c.span!=null||!c.room) return; const st=roomStats(c); if(!st||!st.mo) return; const lab=roomLabel(c.room); by[lab]=(by[lab]||0)+st.mo; });
  const L=Object.entries(by).map(([n,v])=>[n,v]); if(k.over) L.push(['Not enough housing',-2]); if(k.heatScare) L.push(['Heat 50+ (residents scared)',-1]);
  return L.sort((a,b)=>b[1]-a[1]); }
function moralePanel(){ const k=shipCalc(); const L=moraleSources();
  return `<div class="panel" style="margin-top:14px"><div class="panel-h"><h3>Ship Morale</h3><span class="mono" style="margin-left:8px;font-weight:700;color:${k.morale<0?'var(--danger)':'var(--good)'}">${sgn(k.morale)}</span><span class="status" style="margin-left:6px">${k.tier}</span></div><div class="panel-b" style="padding:6px 14px">
   ${L.map(([n,v])=>`<div class="bonusrow"><span>${esc(n)}</span><b style="color:${v<0?'var(--danger)':'var(--good)'}">${sgn(v)}</b></div>`).join('')||'<div class="empty" style="padding:8px">No rooms affect morale yet.</div>'}
   <div class="eyebrow" style="margin:10px 0 4px">Morale tiers</div>
   ${MORALE_TIERS.map(t=>`<div class="mtier ${t[0]===k.tier?'on':''}"><b>${t[0]}</b> <small>${t[1]}</small><div>${t[3]}</div></div>`).join('')}
   <p style="font-size:11px;color:var(--ink-faint);margin:8px 0 2px">Rooms and upgrades add or remove morale. Overcrowding costs \u22122; Heat of 50+ with either faction costs \u22121. Income multiplier and Renown apply automatically; the rest are for the DM to apply.</p></div></div>`; }

/* ============================ modals ============================ */
function modal(html){ $('#modalRoot').innerHTML=`<div class="scrim" onclick="if(event.target===this)closeModal()">${html}</div>`; }
function closeModal(){ $('#modalRoot').innerHTML=''; }

function openIdentity(){
  const chars=Object.values(S.chars).sort((a,b)=>a.name.localeCompare(b.name));
  let h=`<div class="modal"><div class="modal-h"><h3>Who's at this terminal?</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-b"><p style="color:var(--ink-mid);font-size:12.5px;margin:0 0 14px">Pick your pilot to edit your own sheet, or sign in as DM for full control. Saved to this browser.</p>
    <div style="display:flex;flex-direction:column;gap:8px">`;
  chars.forEach(c=>{ h+=`<button class="itemrow" style="width:100%" onclick="setIdentity('${c.id}')">
     <span class="avatar" style="background:${c.avatarColor}">${esc(initials(c.name))}</span>
     <div class="info"><div class="n">${esc(c.name)}</div><div class="d">${esc(c.class||'')} · pilot of ${esc((Object.values(S.mechs).find(m=>m.id===c.mechRef)||{}).name||'—')}</div></div>
     ${S.identity===c.id?'<span class="you">CURRENT</span>':''}</button>`; });
  h+=`<button class="itemrow" style="width:100%;border-color:var(--mech-dim)" onclick="setIdentity('dm')">
     <span class="avatar" style="background:var(--mech)">DM</span>
     <div class="info"><div class="n">Dungeon Master</div><div class="d">Admin — edit every pilot, mech &amp; house rule</div></div>
     ${S.identity==='dm'?'<span class="you">CURRENT</span>':''}</button>`;
  h+=`</div></div></div>`;
  modal(h);
}
function setIdentity(id){
  if(id==='dm'){ promptDM(); return; }
  S.identity=id; localStorage.setItem('mm_identity',id); localStorage.removeItem('mm_dmtoken');
  S.auth.dmToken=undefined; S.auth.pilotId=id; S.sel=id;
  closeModal(); renderAll(); toast('Identity set',S.chars[id]?.name);
}
function promptDM(){
  modal(`<div class="modal" style="width:min(400px,94vw)"><div class="modal-h"><h3>DM Sign-In</h3><button class="x" onclick="openIdentity()">×</button></div>
   <div class="modal-b"><p style="color:var(--ink-mid);font-size:12.5px;margin:0 0 12px">Enter the DM password to unlock full edit access to every pilot, mech &amp; house rule.</p>
   <div id="dm_err"></div>
   <label class="fld"><span>DM password</span><input id="dm_pw" type="password" onkeydown="if(event.key==='Enter')doDM()"></label>
   <button class="btn" style="width:100%" onclick="doDM()">Unlock</button></div></div>`);
  setTimeout(()=>{const i=$('#dm_pw');if(i)i.focus();},40);
}
async function doDM(){
  const pw=$('#dm_pw').value;
  const r=await fetch('/api/dm-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})}).then(r=>r.json()).catch(()=>({ok:false}));
  if(!r.ok){ $('#dm_err').innerHTML='<div class="warnchip" style="margin-bottom:10px">⚠ Wrong password</div>'; return; }
  S.identity='dm'; S.auth.dmToken=r.dmToken; S.auth.pilotId=undefined;
  localStorage.setItem('mm_identity','dm'); localStorage.setItem('mm_dmtoken',r.dmToken);
  closeModal(); renderAll(); toast('DM access granted','Full control unlocked');
}

function openRules(){
  if(!isDM()) return;
  const s=S.settings;
  modal(`<div class="modal"><div class="modal-h"><h3>House Rules</h3><button class="x" onclick="closeModal()">×</button></div>
   <div class="modal-b">
    <label class="fld"><span>Mech overload penalty rule</span><textarea id="r_mech">${esc(s.mechOverloadRule||'Each modification installed beyond the mech\'s slot capacity imposes a cumulative −1 penalty to the mech\'s attack rolls and saving throws.')}</textarea></label>
    <label class="fld"><span>Cybernetic overload note (fixed: limit = proficiency bonus, −1/excess to checks &amp; saves)</span>
      <input id="r_cyber" value="${esc(s.cyberNote||'Limit equals proficiency bonus; each excess augment: −1 to ability checks & saving throws.')}"></label>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px">
      <button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveRules()">Save Rules</button></div>
   </div></div>`);
}
function saveRules(){ S.settings.mechOverloadRule=$('#r_mech').value; S.settings.cyberNote=$('#r_cyber').value; saveSettings(); closeModal(); renderMain(); toast('House rules updated',''); }

/* ---------- catalog browser ---------- */
const CAT_FILTERS={
  'char':['weapon-ranged','weapon-melee','armor','shield','equipment','gear','consumable','ammunition','explosive'],
  'techpower':['techpower'],
  'cybernetic':['cybernetic'],
  'augment':['cybernetic','techpower'],
  'maugment':['cybernetic','techpower'],
  'mech':['ship-modification','ship-component','ship-shield'],
  'mech-weapon':['ship-weapon','weapon-ranged','weapon-melee'],
};
let CATX={scope:'char',q:'',cat:'all'};
function openCatalog(scope){
  const c=cur(); if(!canEdit(c.id)) return warnEdit();
  CATX={scope,q:'',cat:'all'};
  renderCatalog();
}
function renderCatalog(){
  const scope=CATX.scope; const allowed=CAT_FILTERS[scope]||[];
  const custom=Object.values(S.library).filter(i=>allowed.includes(i.category));
  const base=S.catalog.filter(i=>allowed.includes(i.category));
  let pool=[...custom,...base];
  if(CATX.cat!=='all') pool=pool.filter(i=>i.category===CATX.cat);
  if(CATX.q){ const q=CATX.q.toLowerCase(); pool=pool.filter(i=>(i.name||'').toLowerCase().includes(q)||(i.description||'').toLowerCase().includes(q)); }
  pool=pool.slice(0,300);
  const cats=[...new Set(allowed.filter(a=>[...custom,...base].some(i=>i.category===a)))];
  const title={char:'Add Personal Gear',techpower:'Add Tech Power',cybernetic:'Add Cybernetic Augment',augment:'Add Augment or Ability (chits)',maugment:'Add Mech Augment (chits &amp; implants)',mech:'Add Mech Part','mech-weapon':'Mount Mech Weapon'}[scope]||'Catalog';
  let h=`<div class="modal wide"><div class="modal-h"><h3>${title}</h3><span class="status" style="margin-left:6px">${S.catalogReady?S.catalog.length.toLocaleString()+' items':'catalog loading…'}</span><span style="flex:1"></span><button class="btn sec" onclick="openCreate('${scope}')">✎ Create Custom</button><button class="x" onclick="closeModal()">×</button></div>
   <div class="modal-b">
    <div class="catsearch"><input id="catq" placeholder="Search ${pool.length?'':'— '}by name or text…" value="${esc(CATX.q)}" oninput="CATX.q=this.value;renderCatalogList()"></div>
    <div class="chipbar" id="catchips"><button class="fchip ${CATX.cat==='all'?'on':''}" onclick="CATX.cat='all';renderCatalog()">All</button>${cats.map(ct=>`<button class="fchip ${CATX.cat===ct?'on':''}" onclick="CATX.cat='${ct}';renderCatalog()">${esc(catLabel(ct))}</button>`).join('')}</div>
    <div class="catlist" id="catlist">${catRows(pool)}</div>
   </div></div>`;
  modal(h);
  setTimeout(()=>{const q=$('#catq');if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length);}},30);
}
function renderCatalogList(){
  const scope=CATX.scope; const allowed=CAT_FILTERS[scope]||[];
  let pool=[...Object.values(S.library).filter(i=>allowed.includes(i.category)),...S.catalog.filter(i=>allowed.includes(i.category))];
  if(CATX.cat!=='all') pool=pool.filter(i=>i.category===CATX.cat);
  if(CATX.q){ const q=CATX.q.toLowerCase(); pool=pool.filter(i=>(i.name||'').toLowerCase().includes(q)||(i.description||'').toLowerCase().includes(q)); }
  $('#catlist').innerHTML=catRows(pool.slice(0,300));
}
function catLabel(c){ return ({'weapon-ranged':'Ranged','weapon-melee':'Melee','ship-modification':'Modifications','ship-weapon':'Ship Weapons','techpower':'Tech Powers','cybernetic':'Cybernetics','armor':'Armor','equipment':'Equipment'})[c]||c; }
function catRows(pool){
  if(!pool.length) return `<div class="empty">No matches. Try “Create Custom”.</div>`;
  return pool.map((i,ix)=>{ const meta=[catLabel(i.category), i.damage||'', i.cost?('◈'+i.cost):'', i.grade!=null?('G'+i.grade):'', i.properties||''].filter(Boolean).join(' · ');
    window.__cat=window.__cat||{}; const key=(i.id||'x')+'_'+ix; window.__cat[key]=i;
    return `<div class="catrow"><div class="info"><div class="n">${esc(i.name)}</div><div class="m">${esc(meta.slice(0,90))}</div></div>
      <span class="src">${esc(i.source||'')}</span>
      <button class="rbtn" onclick='addFromCatalog("${key}")'>Add</button></div>`; }).join('');
}
function chitToPower(i){ const d=String(i.description||'');
  const dm=d.match(/(\d+d\d+(?:\s*\+\s*mod)?)\s*([A-Za-z]+)?/);
  const tp=(d.match(/(\d+)\s*Tech\s*Point/i)||d.match(/spend\s*(\d+)/i));
  const act=(d.match(/\b(bonus action|reaction|action|minute|hour)\b/i)||[])[1]||'';
  const heal=/heal/i.test(d);
  return { name:i.name, level:i.level||null, school:'tec', activation:act, save:'',
    damage: dm?[{formula:dm[1].replace(/\s/g,''), type: heal?'healing':((dm[2]||'').toLowerCase()==='healing'?'healing':(dm[2]||''))}]:[],
    tpCost: tp?parseInt(tp[1]):(i.resourceCost||null), desc:i.description||'' }; }
function addFromCatalog(key){
  const i=window.__cat[key]; if(!i) return; const scope=CATX.scope; const c=cur(); if(!canEdit(c.id))return warnEdit();
  const cost=Math.max(0,Math.round((i.cost||0)*(1-(typeof shopDiscount==='function'?shopDiscount():0))));
  if(cost>(c.credits||0)){ toast('Insufficient credits','Need ◈'+cost.toLocaleString()+' · have ◈'+(c.credits||0).toLocaleString()); return; }
  const asPower=()=>{ c.powers=c.powers||[]; c.powers.push(chitToPower(i)); saveChar(c); toast('Ability card added',i.name); };
  const asCyber=()=>{ c.cybernetics=c.cybernetics||[]; c.cybernetics.push({name:i.name,subtype:i.subtype||i.rarity||'',desc:i.description||'',effects:[]}); saveChar(c); toast('Augment installed',i.name); };
  if(scope==='augment'){ if(i.category==='techpower') asPower(); else asCyber(); }
  else if(scope==='cybernetic'){ asCyber(); }
  else if(scope==='techpower'){ asPower(); }
  else if(scope==='maugment'){ const m=curMech(); m.augments=m.augments||[]; if(i.category==='techpower'){ const pw=chitToPower(i); m.augments.push({id:(i.id||uid())+'-'+uid().slice(0,3),name:pw.name,desc:pw.desc,effects:[],abilityCard:true,activation:pw.activation,damage:pw.damage,tpCost:pw.tpCost,rollAbility:null}); } else { m.augments.push({id:(i.id||uid())+'-'+uid().slice(0,3),name:i.name,desc:i.description||'',effects:[],abilityCard:false}); } saveMech(m); toast('Mech augment added',i.name); }
  else if(scope==='mech'){ const m=curMech(); m.mods=m.mods||[]; m.mods.push({id:(i.id||uid())+'-'+uid().slice(0,3),name:i.name,grade:i.grade??null,system:i.subtype||'',desc:i.description||'',equipped:true}); if(m.modSlots)m.modSlots.used=(m.mods||[]).filter(x=>x.equipped!==false).length; saveMech(m); toast('Part installed',i.name); }
  else if(scope==='mech-weapon'){ const m=curMech(); m.weapons=m.weapons||[]; m.weapons.push({id:(i.id||uid())+'-'+uid().slice(0,3),name:i.name,damage:i.damage?[{formula:String(i.damage).replace(/[^0-9d+ ]/g,'').trim()||'1d6',type:i.damageType||''}]:[],properties:i.properties||'',desc:i.description||'',equipped:true}); saveMech(m); toast('Weapon mounted',i.name); }
  else { c.inventory=c.inventory||[]; c.inventory.push({id:(i.id||uid())+'-'+uid().slice(0,3),name:i.name,type:catToItemType(i.category),qty:1,weight:i.weight||0,equipped:false,
      damage:i.damage?[{formula:String(i.damage).replace(/[^0-9d+ ]/g,'').trim()||'',type:i.damageType||''}]:[],properties:i.properties||'',actionType:i.category==='weapon-melee'?'mwak':'rwak',attackAbility:i.category==='weapon-melee'?'str':'dex',desc:i.description||''}); saveChar(c); toast('Added to inventory',i.name); }
  if(cost>0){ c.credits=Math.max(0,(c.credits||0)-cost); saveChar(c); toast('Purchased −◈'+cost.toLocaleString(),'◈'+c.credits.toLocaleString()+' credits left'); }
  renderMain();
}
function catToItemType(c){ return ({'weapon-ranged':'weapon','weapon-melee':'weapon','armor':'equipment','equipment':'equipment','consumable':'consumable'})[c]||'loot'; }

/* ---------- create custom (also adds to shared library) ---------- */
function openCreate(scope){
  const isMech=scope==='mech'||scope==='mech-weapon';
  modal(`<div class="modal"><div class="modal-h"><h3>Create Custom ${isMech?'Mech Part':'Item'}</h3><button class="x" onclick="renderCatalog()">×</button></div>
   <div class="modal-b">
    <label class="fld"><span>Name</span><input id="c_name" placeholder="e.g. Ion Lance Mk II"></label>
    <div class="row2">
      <label class="fld"><span>Category</span><select id="c_cat">${(CAT_FILTERS[scope]||[]).map(x=>`<option value="${x}">${catLabel(x)}</option>`).join('')}</select></label>
      <label class="fld"><span>Cost (cr)</span><input id="c_cost" type="number" value="0"></label>
    </div>
    <div class="row2">
      <label class="fld"><span>Damage (e.g. 2d6)</span><input id="c_dmg" placeholder="optional"></label>
      <label class="fld"><span>${isMech?'Grade':'Weight (lb)'}</span><input id="c_x" type="number" placeholder="optional"></label>
    </div>
    <label class="fld"><span>Properties / tags</span><input id="c_props" placeholder="e.g. Finesse, Reach"></label>
    <label class="fld"><span>Description</span><textarea id="c_desc"></textarea></label>
    <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-mid)"><input type="checkbox" id="c_lib" checked style="width:auto"> Also save to shared party library (everyone can use it)</label>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px"><button class="btn sec" onclick="renderCatalog()">Back</button><button class="btn" onclick="saveCreate('${scope}')">Create &amp; Add</button></div>
   </div></div>`);
}
async function saveCreate(scope){
  const name=$('#c_name').value.trim(); if(!name)return;
  const cat=$('#c_cat').value, cost=parseFloat($('#c_cost').value)||0, dmg=$('#c_dmg').value.trim(),
    x=$('#c_x').value, props=$('#c_props').value.trim(), desc=$('#c_desc').value.trim(), toLib=$('#c_lib').checked;
  const isMech=scope==='mech'||scope==='mech-weapon';
  const item={id:name.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-'+uid().slice(0,4),name,category:cat,domain:isMech?'mech':'character',source:'HOMEBREW',cost,
    damage:dmg||null, properties:props||null, description:desc||null, grade:isMech&&x?parseFloat(x):null, weight:!isMech&&x?parseFloat(x):null};
  S.library[item.id]=item;
  if(toLib && socket){ socket.emit('write',{auth:authPayload(),collection:'library',id:item.id,data:item}); }
  // add straight to the character/mech too
  window.__cat=window.__cat||{}; window.__cat['new']=item; CATX.scope=scope; addFromCatalog('new');
  renderCatalog();
}

/* ============================ roll feed ============================ */
function toggleFeed(v){ const d=$('#feedDrawer'); const open=v==null?!d.classList.contains('open'):v; d.classList.toggle('open',open);
  if(open){ S.seenRolls=(S.rolls[0]?.t)||Date.now(); localStorage.setItem('mm_seenrolls',S.seenRolls); updateBadge(); } }
$('#feedBtn').onclick=()=>toggleFeed();
function renderFeed(){
  const list=$('#feedList');
  list.innerHTML=(S.rolls||[]).map(r=>{ const c=r.crit>0?'crit':r.crit<0?'fail':'';
    return `<div class="rollitem"><div class="rc ${c}">${esc(r.total)}</div>
      <div style="flex:1;min-width:0"><div class="who">${esc(r.who)}</div><div class="what">${esc(r.label)}</div><div class="brk">${esc(r.brk||'')}</div></div>
      <div class="tm">${timeAgo(r.t)}</div></div>`; }).join('')||'<div class="empty">No rolls yet. Click any ability, save, or weapon.</div>';
  updateBadge();
}
function updateBadge(){ const b=$('#feedBadge'); const n=(S.rolls||[]).filter(r=>r.t>S.seenRolls).length;
  if(n>0 && !$('#feedDrawer').classList.contains('open')){ b.textContent=n>9?'9+':n; b.classList.remove('hidden'); } else b.classList.add('hidden'); }
function timeAgo(t){ const s=Math.floor((Date.now()-t)/1000); if(s<60)return s+'s'; if(s<3600)return Math.floor(s/60)+'m'; return Math.floor(s/3600)+'h'; }

/* ---------- adv toggle ---------- */
$('#advTog').querySelectorAll('button').forEach(b=>b.onclick=()=>{ S.adv=b.dataset.adv; $('#advTog').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); if(S.tab==='dash')renderMain(); });

/* ---------- toast (non-roll) ---------- */
function toast(title,sub){ const t=$('#toast'); t.className=''; t.innerHTML=`<div><div class="rn">${esc(title)}</div><div class="lab">${esc(sub||'')}</div></div>`;
  requestAnimationFrame(()=>t.classList.add('show')); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2200); }

/* ---------- launch ---------- */
boot();
</script>
