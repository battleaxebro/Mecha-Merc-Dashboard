services:
  - type: web
    name: mecha-merc
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: PARTY_CODE
        sync: false        # set your own in the Render dashboard
      - key: DM_PASSWORD
        sync: false        # set your own in the Render dashboard
      - key: DATABASE_URL
        fromDatabase:
          name: mecha-merc-db
          property: connectionString

databases:
  - name: mecha-merc-db
    plan: free
